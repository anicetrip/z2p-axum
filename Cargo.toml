[package]
name = "z2p-axum"
version = "0.1.0"
edition = "2024"

[lib]
name = "z2p_axum"
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "z2p-axum"



[workspace]
members = [
    ".",
    "migration"
]


[workspace.dependencies]
sea-orm = { version = "2.0.0", default-features = false, features = [
    "sqlx-mysql",
    "runtime-tokio-native-tls",
    "macros",
    "with-chrono",
    "with-uuid",
    "debug-print",
] }

sea-orm-migration = { version = "2.0.0", default-features = false, features = [
    "sqlx-mysql",
] }

sqlx = { version = "0.9.0", default-features = false, features = [
    "mysql",
    "runtime-tokio-native-tls"
] }
[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
sea-orm = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

config = "0.15.25"

tracing = "0.1.44"
dotenvy = "0.15.7"  # 用于加载 .env 文件


url = { version = "2.5.8", features = ["serde"] }
tower-http = { version = "0.7.0", features = ["trace"] }

secrecy = { version = "0.10.3", features = ["serde"] }

tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

serde-aux = "4.7.0"
claims = "0.8"
validator = "0.20.0"
fake = "5.1.0"
unicode-segmentation = "1.13.3"
proptest = "1.11"
linkify = "0.11.0"
serde_json = "1.0.151"
wiremock = { version = "0.6.5", default-features = false }

migration = { path = "migration" }
thiserror = "2.0.19"
anyhow = "1.0.104"
